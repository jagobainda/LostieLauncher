# Version catalog — the single place where a dependency version is written.
#
# Rule for this side of the monorepo: no version literal in a build script. If
# you need a library, declare it here and reference the alias. Dependabot reads
# this file (see ../../.github/dependabot.yml, `gradle` ecosystem at /android).
#
# Some entries below are declared but not yet used by :app. That is deliberate:
# the stack for the whole port was chosen and pinned in one go (port plan step
# 03) so later steps add a dependency line, not a version decision. Every one
# of them is claimed by a numbered step, noted alongside.

[versions]
# ── Toolchain ───────────────────────────────────────────────────────────────
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
# AGP 9 requires JDK 17 and compiles to it by default; D8 is happy there.
javaTarget = "17"

# ── SDK levels ──────────────────────────────────────────────────────────────
# compileSdk/targetSdk 37 is Android 17, AGP 9.4's maximum. minSdk 26 buys
# java.time without desugaring, notification channels and adaptive icons.
compileSdk = "37"
minSdk = "26"
targetSdk = "37"

# ── AndroidX and Compose ────────────────────────────────────────────────────
androidxCore = "1.19.0"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
composeBom = "2026.09.00"
navigationCompose = "2.10.1"          # step 11
datastore = "1.2.1"
room = "2.8.5"                        # step 07
work = "2.11.2"                       # step 08

# ── Dependency injection ────────────────────────────────────────────────────
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"

# ── Asynchrony and serialization ────────────────────────────────────────────
coroutines = "1.11.0"
kotlinxSerialization = "1.11.0"

# ── Network and images ──────────────────────────────────────────────────────
okhttp = "5.5.0"
retrofit = "3.0.0"
coil = "3.6.3"                        # step 12

# ── Test ────────────────────────────────────────────────────────────────────
junit = "6.1.3"
androidJunitPlugin = "2.0.1"
mockk = "1.14.11"
kotest = "6.2.5"
turbine = "1.2.1"

# ── Static analysis ─────────────────────────────────────────────────────────
spotless = "8.10.2"
ktlint = "1.8.0"

[libraries]
# ── AndroidX ────────────────────────────────────────────────────────────────
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }

# ── Compose (versions come from the BOM, never pinned here) ─────────────────
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

# ── Persistence ─────────────────────────────────────────────────────────────
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# ── Claimed by later steps ──────────────────────────────────────────────────
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# ── Dependency injection ────────────────────────────────────────────────────
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "hiltNavigationCompose" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" } # step 11

# ── Network ─────────────────────────────────────────────────────────────────
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3-junit5", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }

# ── Asynchrony and serialization ────────────────────────────────────────────
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# ── Test ────────────────────────────────────────────────────────────────────
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# `org.jetbrains.kotlin.android` is deliberately absent: AGP 9 compiles Kotlin
# itself (built-in Kotlin) and the old plugin is incompatible with its new DSL.
# The Kotlin version below is what pulls KGP 2.4.20 onto the build classpath.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
android-junit = { id = "de.mannodermaus.android-junit", version.ref = "androidJunitPlugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
