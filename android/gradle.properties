# Gradle
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 defaults both of these to true. They are written out because they are
# load-bearing here: the new DSL is what `android { kotlin { } }` below relies
# on, and built-in Kotlin is why no `org.jetbrains.kotlin.android` plugin is
# applied anywhere in this build.
android.newDsl=true
android.builtInKotlin=true

# Kotlin
kotlin.code.style=official
