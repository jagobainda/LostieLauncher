version: 2
updates:
    - package-ecosystem: nuget
      directory: /desktop
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      groups:
          minor-and-patch:
              update-types:
                  - minor
                  - patch
          microsoft-extensions-major:
              patterns:
                  - "Microsoft.Extensions.*"
              update-types:
                  - major
      ignore:
          - dependency-name: Velopack

    - package-ecosystem: gradle
      directory: /android
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      groups:
          minor-and-patch:
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
