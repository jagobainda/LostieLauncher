name: CI

on:
    push:
        branches: [main, development]
    pull_request:
        branches: [main, development]

# Two sides, two toolchains, two sets of jobs. Each job sets the
# `working-directory` of the side it belongs to and runs exactly the commands
# that side's AGENTS.md documents, so a green pipeline and a green local run
# mean the same thing.
#
#   format-check, build-and-test, vulnerable-dependencies
#              WPF / .NET, windows-latest, working-directory: desktop
#   android-*  Gradle / Kotlin, ubuntu-latest, working-directory: android
#
# The three desktop jobs keep their original, unprefixed names so any branch
# protection rule that references them is unaffected. New jobs carry the name of
# the side they belong to.
jobs:
    format-check:
        runs-on: windows-latest

        defaults:
            run:
                working-directory: desktop

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "10.0.x"

            - name: Restore dependencies
              run: dotnet restore LostieLauncher.slnx

            - name: Check formatting
              run: dotnet format LostieLauncher.slnx --verify-no-changes --verbosity diagnostic

    build-and-test:
        runs-on: windows-latest

        defaults:
            run:
                working-directory: desktop

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "10.0.x"

            - name: Restore dependencies
              run: dotnet restore LostieLauncher.slnx

            - name: Build
              run: dotnet build LostieLauncher.slnx --no-restore --configuration Release

            - name: Test
              run: dotnet test LostieLauncher.slnx --no-build --configuration Release --verbosity normal

    vulnerable-dependencies:
        runs-on: windows-latest

        defaults:
            run:
                working-directory: desktop

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "10.0.x"

            - name: Restore dependencies
              run: dotnet restore LostieLauncher.slnx

            - name: Check for vulnerable NuGet packages
              shell: pwsh
              run: |
                  $report = dotnet list LostieLauncher.slnx package --vulnerable --include-transitive --format json --output-version 1 | Out-String
                  if ($LASTEXITCODE -ne 0) {
                      Write-Host $report
                      Write-Error "dotnet list package failed (exit code $LASTEXITCODE)."
                      exit 1
                  }
                  Write-Host $report

                  $json = $report | ConvertFrom-Json
                  $vulnerable = @(foreach ($project in $json.projects) {
                      foreach ($framework in $project.frameworks) {
                          foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                              if (@($package.vulnerabilities | Where-Object { $null -ne $_ }).Count -gt 0) {
                                  '{0}@{1} ({2})' -f $package.id, $package.resolvedVersion, $framework.framework
                              }
                          }
                      }
                  })

                  if ($vulnerable.Count -gt 0) {
                      Write-Error "Vulnerable NuGet packages detected:`n$($vulnerable -join "`n")"
                      exit 1
                  }

                  Write-Host 'No vulnerable NuGet packages detected.'

    android-format-check:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: android

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup JDK
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Check formatting
              run: ./gradlew spotlessCheck

    android-build-and-test:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: android

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup JDK
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6

            # assembleDebug proves it builds, testDebugUnitTest runs the suite,
            # and lintDebug is the warnings-are-failures gate (the module sets
            # warningsAsErrors). These are the three commands android/AGENTS.md
            # tells a contributor to run before opening a PR.
            - name: Build, test and lint
              run: ./gradlew assembleDebug testDebugUnitTest lintDebug

            - name: Upload reports on failure
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: android-reports
                  path: |
                      android/app/build/reports/
                      android/app/build/test-results/
                  retention-days: 7
